name: Deploy Django Project

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key and Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Base64 kodlanan açary açyp id_rsa faýlyna ýazmak
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/id_rsa \
              root@45.61.158.184 << 'EOF'
            
            if [ -d "/root/paylas_ulgamy" ]; then
              cd /root/paylas_ulgamy
              git pull origin main
            else
              git clone https://github.com/jonatanjohn579-glitch/paylas-ulgamy.git /root/paylas_ulgamy
              cd /root/paylas_ulgamy
            fi
            
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            
            pip install --upgrade pip
            pip install -r requirements.txt
            python manage.py migrate
            python manage.py collectstatic --noinput
            
            sudo systemctl restart paylas_ulgamy || true
          EOF