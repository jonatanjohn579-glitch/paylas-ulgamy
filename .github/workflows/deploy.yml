name: Deploy Django Project

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass and Deploy
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          
          sshpass -p "$VPS_PASSWORD" ssh \
            -o StrictHostKeyChecking=accept-new \
            root@45.61.158.184 << 'EOF'
            
            if [ -d "/root/paylas_ulgamy" ]; then
              cd /root/paylas_ulgamy
              git pull origin main
            else
              git clone https://github.com/jonatanjohn579-glitch/paylas-ulgamy.git /root/paylas_ulgamy
              cd /root/paylas_ulgamy
            fi
            
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            
            pip install --upgrade pip
            pip install -r requirements.txt
            python manage.py migrate
            python manage.py collectstatic --noinput
            
            sudo systemctl restart paylas_ulgamy || true
          EOF