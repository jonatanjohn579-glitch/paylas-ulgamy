name: My Django Project CI
on: push

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
      
      - name: Connect to VPS
        run: |
          export SSHPASS="Salam@123"

          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -p 22 \
            root@45.61.158.184 \
            "whoami && hostname && uptime"